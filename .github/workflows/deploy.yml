name: Reusable Deployment Workflow

on:
    workflow_call:
        inputs:
            environment:
                description: 'Target environment for deployment'
                required: true
                type: string
        secrets:
            aws-role-arn:
                description: 'AWS IAM role ARN to assume for deployment'
                required: true
jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        defaults:
            run:
                working-directory: app-service

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              continue-on-error: true
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.aws-role-arn }}
                  aws-region: ap-southeast-2
            - name: Debug OIDC Token Claims
              run: |
                echo "Requesting OIDC token..."
                ACTIONS_ID_TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
                echo "JWT Claims:"
                jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$ACTIONS_ID_TOKEN"

            - name: Deploy to ${{ inputs.environment }}
              run: make deploy ENV=${{ inputs.environment }}
